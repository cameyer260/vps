<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <!-- An empty data URI stops the browser's default /favicon.ico request. -->
  <link rel="icon" href="data:," />
  <title>Published pages — admin</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}" />
  <script src="/static/js/app.js?v={{ asset_version }}" defer></script>
</head>
<body>
  {# The iOS status-bar strip: see the comment in notes.html. #}
  <div class="status-bar-backdrop" aria-hidden="true"></div>
  <main class="reading-pane">
    <div class="pane-actions"><a class="box-link" href="/">Notes</a></div>
    <article class="note">
      <h1 class="note-title">Published pages</h1>
      {% if pages.is_empty() %}
      <p class="note-empty">No published pages yet.</p>
      {% else %}
      <ul class="page-list">
        {% for page in pages %}
        <li><a href="/s/{{ page.slug }}/">{{ page.slug }}</a><time datetime="{{ page.datetime }}" data-epoch="{{ page.published }}">{{ page.fallback }}</time></li>
        {% endfor %}
      </ul>
      {% endif %}
    </article>
  </main>
</body>
</html>
