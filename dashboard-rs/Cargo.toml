[package]
name = "dashboard-rs"
version = "0.1.0"
edition = "2024"
description = "Rust port of the VPS admin dashboard (Axum + Askama + htmx)"

# Crate list is minimal by design (ADR 0005): each dependency below earned
# its place in Phase 1. New crates need a demonstrated need, not convenience.

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["fs"] }
askama = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
